<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veo Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand"><span class="logo">◈</span> Veo Studio <span class="free">FREE</span></div>

    <label class="lbl">Prompt</label>
    <textarea id="prompt" placeholder="Describe your video — e.g. 'a red fox running through fresh snow, cinematic, slow motion, golden hour'"></textarea>

    <label class="lbl">Model</label>
    <select id="model">
      <option value="veo-3.1-fast-generate-001">Veo 3.1 Fast — fast &amp; cheap (default)</option>
      <option value="veo-3.1-generate-001">Veo 3.1 — highest quality</option>
      <option value="veo-3.1-lite-generate-001">Veo 3.1 Lite — cheapest</option>
      <option value="veo-3.0-fast-generate-001">Veo 3.0 Fast</option>
      <option value="veo-3.0-generate-001">Veo 3.0</option>
    </select>

    <label class="lbl">Duration</label>
    <div class="pills" id="duration"><button data-v="4" class="on">4s</button><button data-v="6">6s</button><button data-v="8">8s</button></div>

    <label class="lbl">Aspect ratio</label>
    <div class="pills" id="aspect"><button data-v="16:9" class="on">16:9</button><button data-v="9:16">9:16</button></div>

    <label class="lbl">Resolution</label>
    <div class="pills" id="resolution"><button data-v="720p" class="on">720p</button><button data-v="1080p">1080p</button></div>

    <label class="row"><span>Audio</span><input type="checkbox" id="audio" checked></label>

    <label class="lbl">Frames — optional (image → video)</label>
    <div class="uploads">
      <div class="upslot" id="startSlot">
        <input type="file" accept="image/*" id="startImg" hidden>
        <div class="thumb" id="startThumb">+ Start</div>
        <b class="x" id="startX" hidden>×</b>
      </div>
      <div class="upslot" id="endSlot">
        <input type="file" accept="image/*" id="endImg" hidden>
        <div class="thumb" id="endThumb">+ End</div>
        <b class="x" id="endX" hidden>×</b>
      </div>
    </div>

    <label class="lbl">Reference images — optional, up to 3 (locks 8s)</label>
    <div class="uploads">
      <div class="upslot" id="ref0Slot"><input type="file" accept="image/*" id="ref0Img" hidden><div class="thumb" id="ref0Thumb">+ Ref</div><b class="x" id="ref0X" hidden>×</b></div>
      <div class="upslot" id="ref1Slot"><input type="file" accept="image/*" id="ref1Img" hidden><div class="thumb" id="ref1Thumb">+ Ref</div><b class="x" id="ref1X" hidden>×</b></div>
      <div class="upslot" id="ref2Slot"><input type="file" accept="image/*" id="ref2Img" hidden><div class="thumb" id="ref2Thumb">+ Ref</div><b class="x" id="ref2X" hidden>×</b></div>
    </div>
    <div class="pills" id="refType"><button data-v="asset" class="on">Subject</button><button data-v="style">Style</button></div>

    <label class="lbl">Extend a video — optional (+7s)</label>
    <div class="upslot wide" id="extSlot"><input type="file" accept="video/*" id="extVid" hidden><div class="thumb" id="extThumb">+ Video to continue</div><b class="x" id="extX" hidden>×</b></div>

    <details class="adv">
      <summary>Advanced</summary>
      <label class="lbl">Negative prompt</label>
      <textarea id="negPrompt" placeholder="What to avoid — e.g. blurry, text, watermark"></textarea>
      <div class="advrow">
        <div>
          <label class="lbl">Seed</label>
          <input type="number" id="seed" placeholder="random">
        </div>
        <div>
          <label class="lbl">People</label>
          <select id="personGen">
            <option value="">Default</option>
            <option value="allow_all">Allow all</option>
            <option value="allow_adult">Adults only</option>
            <option value="dont_allow">Don't allow</option>
          </select>
        </div>
      </div>
    </details>

    <button id="go" class="generate"><span id="glabel">Generate</span> <span id="cost" class="cost"></span></button>
    <div class="hint">Billed to your Google Cloud $300 credit · Veo bills per second</div>
  </aside>

  <main class="stage">
    <header class="stage-head">
      <h1>Make videos in one click</h1>
      <p>Google Veo 3 · running on your own Google Cloud credit</p>
    </header>
    <div class="gallery" id="gallery">
      <div class="empty" id="empty">Your generated videos will appear here.</div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
